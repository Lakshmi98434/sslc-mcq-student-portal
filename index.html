<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSLC Science — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F3;
    --rule:#C3D2EA;
    --margin:#C0504D;
    --ink:#202B3C;
    --ink-soft:#5B6577;
    --green:#3F7D5C;
    --red:#B23B3B;
    --gold:#C98A2C;
    --gold-ink:#5C3B0C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 33px,
      var(--rule) 34px
    );
    background-position: 0 78px;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:640px;
    margin:0 auto;
    padding:40px 28px 80px 68px;
    position:relative;
    min-height:100vh;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:44px;
    width:2px;
    background:var(--margin);
    opacity:0.55;
  }
  header.page-head{
    margin-bottom:28px;
  }
  header.page-head .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  h1{
    font-family:'Spectral', serif;
    font-weight:600;
    font-size:32px;
    margin:2px 0 0 0;
    line-height:1.15;
  }
  h1 .accent{ color:var(--margin); }

  .card{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(32,43,58,0.12);
    border-radius:3px;
    padding:22px 22px;
    margin-bottom:18px;
  }

  label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin:14px 0 5px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=email], input[type=password], select{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    padding:9px 10px;
    border:none;
    border-bottom:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    border-radius:0;
  }
  input:focus, select:focus{
    outline:none;
    border-bottom-color:var(--margin);
  }

  .btn{
    display:inline-block;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:11px 22px;
    border-radius:3px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .btn:hover{ background:rgba(32,43,58,0.06); }
  .btn-primary{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--gold-ink);
  }
  .btn-primary:hover{ filter:brightness(0.95); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-row{ margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn-block{ width:100%; }

  .link-btn{
    background:none;border:none;color:var(--margin);
    text-decoration:underline;cursor:pointer;font-size:13.5px;padding:0;
    font-family:'Work Sans', sans-serif;
  }

  .error-msg{
    color:var(--red);
    font-size:13.5px;
    margin-top:10px;
  }
  .hint{
    color:var(--ink-soft);
    font-size:13px;
    margin-top:14px;
  }

  .mode-choice{ display:flex; gap:10px; margin-top:10px; }
  .mode-choice .btn{ flex:1; }
  .mode-choice .btn.active{ background:var(--ink); color:var(--paper); }

  .qcount{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .question-block{
    margin-bottom:26px;
    padding-bottom:22px;
    border-bottom:1px dashed rgba(32,43,58,0.2);
  }
  .question-block:last-child{ border-bottom:none; }
  .q-number{
    font-family:'Spectral', serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink-soft);
  }
  .q-text{
    font-size:17px;
    margin:6px 0 14px;
    line-height:1.45;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:8px 4px;
    cursor:pointer;
    border-radius:3px;
  }
  .option{ color:var(--ink); font-size:15px; margin:0; }
  .option:hover{ background:rgba(32,43,58,0.04); }
  .bubble{
    flex:0 0 26px;
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600;
    margin-top:1px;
    background:transparent;
  }
  .option input{ display:none; }
  .option input:checked + .bubble{
    background:var(--ink);
    color:var(--paper);
  }
  .option-text{ font-size:15px; padding-top:3px; line-height:1.4; }

  /* review state */
  .option.correct .bubble{ background:var(--green); border-color:var(--green); color:var(--paper); }
  .option.incorrect .bubble{ background:var(--red); border-color:var(--red); color:var(--paper); }
  .option.correct .option-text{ color:var(--green); font-weight:600; }
  .option.incorrect .option-text{ color:var(--red); text-decoration:line-through; }

  .explanation{
    margin-top:12px;
    padding:12px 14px;
    background:rgba(201,138,44,0.12);
    border-left:3px solid var(--gold);
    font-size:14px;
    color:var(--ink);
    border-radius:0 3px 3px 0;
  }
  .explanation b{ display:block; font-size:12px; letter-spacing:0.03em; color:var(--gold-ink); margin-bottom:4px; }

  .score-banner{
    text-align:center;
    padding:26px 10px;
    margin-bottom:24px;
  }
  .score-banner .big{
    font-family:'Spectral', serif;
    font-size:52px;
    font-weight:700;
  }
  .score-banner .sub{ color:var(--ink-soft); font-size:14px; margin-top:4px; }

  .topbar{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:8px;
  }
  .topbar .who{ font-size:13px; color:var(--ink-soft); }

  .hidden{ display:none !important; }
  .center{ text-align:center; }
  .loading{ color:var(--ink-soft); font-size:14px; padding:14px 0; }

  /* ---- Phones ---- */
  @media (max-width: 600px){
    .sheet{ padding:24px 16px 60px 38px; }
    .sheet::before{ left:22px; }
    h1{ font-size:26px; }
    .card{ padding:18px 14px; }
    /* 16px stops iPhones from zooming into inputs */
    input[type=text], input[type=email], input[type=password], select{ font-size:16px; padding:11px 8px; }
    .btn{ padding:13px 18px; font-size:15px; }
    .btn-row .btn{ flex:1 1 100%; }
    .mode-choice{ flex-direction:column; }
    /* bigger tap targets for answer options */
    .option{ padding:11px 6px; min-height:48px; align-items:center; }
    .bubble{ flex:0 0 30px; width:30px; height:30px; font-size:13px; margin-top:0; }
    .option-text{ font-size:15.5px; padding-top:0; }
    .q-text{ font-size:16.5px; }
    .score-banner .big{ font-size:42px; }
    .topbar{ flex-wrap:wrap; gap:4px; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="topbar" id="topbar" style="display:none;">
    <span class="eyebrow">SSLC Science — Practice</span>
    <span class="who" id="whoami"></span>
  </div>

  <!-- AUTH VIEW -->
  <section id="view-auth">
    <header class="page-head">
      <div class="eyebrow">SSLC Science — Practice</div>
      <h1>Ready when <span class="accent">you</span> are.</h1>
    </header>

    <div class="card">
      <div id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password">
        <div class="btn-row">
          <button class="btn btn-primary btn-block" onclick="doLogin()">Log in</button>
        </div>
        <div class="error-msg hidden" id="login-error"></div>
        <div class="hint">New here? <button class="link-btn" onclick="toggleAuth('signup')">Create an account</button></div>
      </div>

      <div id="signup-form" class="hidden">
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" autocomplete="name">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" autocomplete="username">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" autocomplete="new-password">
        <div class="btn-row">
          <button class="btn btn-primary btn-block" onclick="doSignup()">Create account</button>
        </div>
        <div class="error-msg hidden" id="signup-error"></div>
        <div class="hint">Already registered? <button class="link-btn" onclick="toggleAuth('login')">Log in</button></div>
      </div>
    </div>
  </section>

  <!-- HOME / SETUP VIEW -->
  <section id="view-home" class="hidden">
    <header class="page-head">
      <div class="eyebrow">Start a test</div>
      <h1>Pick a <span class="accent">subject</span>.</h1>
    </header>

    <div class="card">
      <label for="subject-select">Subject</label>
      <select id="subject-select" onchange="onSubjectChange()"></select>

      <label>Question set</label>
      <div class="mode-choice">
        <button class="btn active" id="mode-random" onclick="setMode('random')">Random mix</button>
        <button class="btn" id="mode-chapter" onclick="setMode('chapter')">By chapter</button>
      </div>

      <div id="chapter-picker" class="hidden">
        <label for="chapter-select">Chapter</label>
        <select id="chapter-select"></select>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary btn-block" onclick="startTest()" id="start-btn">Start test</button>
      </div>
      <div class="error-msg hidden" id="home-error"></div>
    </div>
  </section>

  <!-- TEST VIEW -->
  <section id="view-test" class="hidden">
    <header class="page-head">
      <div class="eyebrow" id="test-subject-label">Test</div>
      <h1>Answer at your <span class="accent">own</span> pace.</h1>
    </header>
    <div class="qcount" id="qcount-label"></div>
    <div class="card" id="questions-container"></div>
    <div class="btn-row">
      <button class="btn btn-primary btn-block" id="submit-btn" onclick="submitTest()">Submit test</button>
    </div>
  </section>

  <!-- RESULTS VIEW -->
  <section id="view-results" class="hidden">
    <div class="score-banner">
      <div class="big" id="score-big">–</div>
      <div class="sub" id="score-sub"></div>
    </div>
    <div class="card" id="review-container"></div>
    <div class="btn-row">
      <button class="btn btn-primary btn-block" onclick="backToHome()">Take another test</button>
    </div>
  </section>

</div>

<script>
/* ===== CONFIG ===== */
/* Paste the URL you get after deploying the Apps Script web app (ends in /exec). */
const API_URL = "https://script.google.com/macros/s/AKfycbz2CXnrk-HZOnze5jIt_G4kjQps3bDGId5fjmDv0zSuwyp_uMChpP5jzF438DWXGvLp/exec";

/* ===== state ===== */
let student = JSON.parse(localStorage.getItem('mcq_student') || 'null');
let subjects = [];
let chaptersForSubject = [];
let mode = 'random';
let currentQuestions = [];
let currentTestId = null;
let currentSubject = '';

/* ===== API helpers ===== */
async function apiGet(action, params) {
  const qs = new URLSearchParams({ action, ...params });
  const res = await fetch(`${API_URL}?${qs.toString()}`);
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Request failed');
  return json.data;
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Request failed');
  return json;
}

/* ===== view switching ===== */
function showView(id) {
  ['view-auth','view-home','view-test','view-results'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
  document.getElementById('topbar').style.display = (id === 'view-auth') ? 'none' : 'flex';
}

function toggleAuth(which) {
  document.getElementById('login-form').classList.toggle('hidden', which !== 'login');
  document.getElementById('signup-form').classList.toggle('hidden', which !== 'signup');
}

/* ===== auth ===== */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; errEl.classList.remove('hidden'); return; }
  try {
    const data = await apiPost('login', { email, password });
    student = { name: data.name, email: data.email };
    localStorage.setItem('mcq_student', JSON.stringify(student));
    afterLogin();
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.remove('hidden');
  }
}

async function doSignup() {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const errEl = document.getElementById('signup-error');
  errEl.classList.add('hidden');
  if (!name || !email || !password) { errEl.textContent = 'Fill in every field.'; errEl.classList.remove('hidden'); return; }
  if (password.length < 6) { errEl.textContent = 'Password should be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
  try {
    const data = await apiPost('signup', { name, email, password });
    student = { name: data.name, email: data.email };
    localStorage.setItem('mcq_student', JSON.stringify(student));
    afterLogin();
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.remove('hidden');
  }
}

function logout() {
  student = null;
  localStorage.removeItem('mcq_student');
  showView('view-auth');
}

async function afterLogin() {
  document.getElementById('whoami').textContent = `${student.name} · logout`;
  document.getElementById('whoami').style.cursor = 'pointer';
  document.getElementById('whoami').onclick = logout;
  showView('view-home');
  await loadSubjects();
}

/* ===== home / setup ===== */
async function loadSubjects() {
  const sel = document.getElementById('subject-select');
  sel.innerHTML = '<option>Loading…</option>';
  try {
    subjects = await apiGet('getSubjects', {});
    if (subjects.length === 0) {
      sel.innerHTML = '<option>No subjects yet — ask your teacher to add questions</option>';
      return;
    }
    sel.innerHTML = subjects.map(s => `<option value="${s}">${s}</option>`).join('');
    onSubjectChange();
  } catch (e) {
    sel.innerHTML = '<option>Could not load subjects</option>';
  }
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-random').classList.toggle('active', m === 'random');
  document.getElementById('mode-chapter').classList.toggle('active', m === 'chapter');
  document.getElementById('chapter-picker').classList.toggle('hidden', m !== 'chapter');
}

async function onSubjectChange() {
  if (mode !== 'chapter') return;
  await loadChapters();
}

async function loadChapters() {
  const subject = document.getElementById('subject-select').value;
  const sel = document.getElementById('chapter-select');
  sel.innerHTML = '<option>Loading…</option>';
  chaptersForSubject = await apiGet('getChapters', { subject });
  sel.innerHTML = chaptersForSubject.map(c => `<option value="${c}">${c}</option>`).join('');
}

document.getElementById('mode-chapter').addEventListener('click', loadChapters);

async function startTest() {
  const subject = document.getElementById('subject-select').value;
  const errEl = document.getElementById('home-error');
  errEl.classList.add('hidden');
  const btn = document.getElementById('start-btn');
  btn.disabled = true; btn.textContent = 'Loading…';
  try {
    const params = { subject, mode, count: 15 };
    if (mode === 'chapter') params.chapter = document.getElementById('chapter-select').value;
    const data = await apiGet('getQuestions', params);
    currentQuestions = data.questions;
    currentTestId = data.testId;
    currentSubject = subject;
    if (currentQuestions.length === 0) {
      errEl.textContent = 'No questions found for that selection yet.';
      errEl.classList.remove('hidden');
      return;
    }
    renderTest();
    showView('view-test');
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Start test';
  }
}

/* ===== test taking ===== */
function renderTest() {
  document.getElementById('test-subject-label').textContent = currentSubject;
  document.getElementById('qcount-label').textContent = `${currentQuestions.length} questions`;
  const c = document.getElementById('questions-container');
  c.innerHTML = currentQuestions.map((q, i) => `
    <div class="question-block" data-qid="${q.id}">
      <div class="q-number">Question ${i + 1}</div>
      <div class="q-text">${escapeHtml(q.question)}</div>
      ${q.options.map((opt, oi) => `
        <label class="option">
          <input type="radio" name="q${q.id}" value="${oi + 1}">
          <span class="bubble">${String.fromCharCode(65 + oi)}</span>
          <span class="option-text">${escapeHtml(opt)}</span>
        </label>
      `).join('')}
    </div>
  `).join('');
}

async function submitTest() {
  // Answers are kept on the server until now. Fetch them for this test.
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const graded = await apiPost('gradeTest', { testId: currentTestId });
    graded.results.forEach(r => {
      const q = currentQuestions.find(x => String(x.id) === String(r.id));
      if (q) { q.correctIndex = r.correctIndex; q.explanation = r.explanation; }
    });
  } catch (e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'Submit test';
    if (/expired/i.test(e.message)) backToHome();
    return;
  }
  btn.disabled = false; btn.textContent = 'Submit test';

  let correctCount = 0;
  const reviewHtml = currentQuestions.map((q, i) => {
    const chosenInput = document.querySelector(`input[name="q${q.id}"]:checked`);
    const chosen = chosenInput ? Number(chosenInput.value) : null;
    const isCorrect = chosen === q.correctIndex;
    if (isCorrect) correctCount++;
    const optionsHtml = q.options.map((opt, oi) => {
      const idx = oi + 1;
      let cls = '';
      if (idx === q.correctIndex) cls = 'correct';
      else if (idx === chosen) cls = 'incorrect';
      return `
        <div class="option ${cls}">
          <span class="bubble">${String.fromCharCode(65 + oi)}</span>
          <span class="option-text">${escapeHtml(opt)}</span>
        </div>`;
    }).join('');
    return `
      <div class="question-block">
        <div class="q-number">Question ${i + 1}${chosen === null ? ' · not answered' : ''}</div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        ${optionsHtml}
        ${q.explanation ? `<div class="explanation"><b>Why</b>${escapeHtml(q.explanation)}</div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('review-container').innerHTML = reviewHtml;
  document.getElementById('score-big').textContent = `${correctCount} / ${currentQuestions.length}`;
  document.getElementById('score-sub').textContent = `${currentSubject} · ${Math.round(correctCount / currentQuestions.length * 100)}% correct`;
  showView('view-results');
  window.scrollTo(0, 0);
}

function backToHome() {
  showView('view-home');
  setMode('random');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

/* ===== boot ===== */
(function init() {
  if (API_URL.indexOf('PASTE_YOUR') === 0) {
    document.body.innerHTML = '<div class="sheet"><div class="card"><b>Setup needed:</b> open index.html and paste your Apps Script web app URL into API_URL near the bottom of the file.</div></div>';
    return;
  }
  if (student) {
    afterLogin();
  } else {
    showView('view-auth');
  }
})();
</script>
</body>
</html>
